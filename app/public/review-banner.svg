  <!-- 远处圆弧山丘 -->
  <path d="M0 150 Q160 92 320 138 T640 128" stroke="#E3CBB8" stroke-width="2.5" fill="none"/>
  <path d="M0 168 Q200 120 400 156 T640 150" stroke="#8FA08A" stroke-opacity="0.55" stroke-width="2.5" fill="none"/>
  <path d="M0 184 Q240 150 480 176 T640 172" stroke="#C9A876" stroke-opacity="0.5" stroke-width="2.5" fill="none"/>
  <!-- 落日：陶土呼吸圆被弧线环抱 -->
  <circle cx="478" cy="86" r="30" fill="#AE7E5E" fill-opacity="0.85"/>
  <circle cx="478" cy="86" r="10" fill="#F6F2EC"/>
  <path d="M430 66 A52 52 0 0 1 526 66" stroke="#AE7E5E" stroke-width="6" fill="none" stroke-opacity="0.8"/>
